# Every place the release version is written: `uvx bump-my-version bump patch` (or `minor`, or
# `--new-version X.Y.Z`) moves them together. The release's tag has to name the same version.
[tool.bumpversion]
current_version = "0.0.6"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """
name = "backlot"
version = "{current_version}"
"""
replace = """
name = "backlot"
version = "{new_version}"
"""

[[tool.bumpversion.files]]
filename = "server.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "server.json"
search = "backlot[mcp]=={current_version}"
replace = "backlot[mcp]=={new_version}"
